<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPMS — Mobile Preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background: #ffffff;
    display:flex; align-items:center; justify-content:center;
    font-family:'DM Sans',sans-serif;
  }

  .blob { display:none; }

  /* ── PHONE ── */
  .phone-outer { position:relative; z-index:1; flex-shrink:0; }

  .phone-outer::before { display:none; }

  .phone-body {
    width:100%; height:100%;
    border-radius:54px;
    background:linear-gradient(168deg,#252527 0%,#181819 45%,#0e0e0f 100%);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow: 0 2px 16px rgba(0,0,0,0.12);
    position:relative;
  }

  /* Buttons */
  .phone-body::before {
    content:'';
    position:absolute; left:-4px; top:20%;
    width:4px; height:7%;
    background:linear-gradient(180deg,#2e2e32,#1c1c1e);
    border-radius:2px 0 0 2px;
    box-shadow:0 calc(100% + 10px) 0 #252528, 0 calc(200% + 20px) 0 #252528, inset 0 1px 0 rgba(255,255,255,0.07);
  }
  .phone-body::after {
    content:'';
    position:absolute; right:-4px; top:25%;
    width:4px; height:12%;
    background:linear-gradient(180deg,#2e2e32,#1c1c1e);
    border-radius:0 2px 2px 0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.07);
  }

  .phone-screen {
    position:absolute;
    top:1.4%; left:1.4%; right:1.4%; bottom:1.4%;
    border-radius:46px;
    overflow:hidden;
    background:#000;
  }

  .phone-display {
    position:absolute; inset:0;
    border-radius:46px;
    overflow:hidden;
    background:#f2f5f9;
  }

  /* Dynamic Island */
  .di {
    position:absolute; top:1.5%; left:50%; transform:translateX(-50%);
    width:35%; height:4.5%;
    background:#000; border-radius:30px; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 15%;
    box-shadow:0 3px 14px rgba(0,0,0,0.75), inset 0 -1px 0 rgba(255,255,255,0.03);
  }
  .di-spk { width:44%; height:33%; background:#1a1a1c; border-radius:10px; }
  .di-cam { width:15%; aspect-ratio:1; border-radius:50%; background:#0d0d0e; border:2px solid #222; box-shadow:0 0 8px rgba(26,111,204,0.4); }

  /* Status bar */
  .sb {
    position:absolute; top:0; left:0; right:0; height:8%;
    z-index:20; display:flex; align-items:flex-end;
    padding:0 8% 1.5%; justify-content:space-between;
    pointer-events:none;
    background:linear-gradient(180deg,rgba(242,245,249,1) 65%,rgba(242,245,249,0) 100%);
    border-radius:46px 46px 0 0;
  }
  .sb-t { font-size:clamp(10px,2vw,14px); font-weight:700; color:#0F1923; letter-spacing:-.4px; }
  .sb-i { display:flex; align-items:center; gap:5px; }
  .sig { display:flex; align-items:flex-end; gap:1.5px; height:11px; }
  .sig span { width:3px; border-radius:1.5px 1.5px 0 0; background:#0F1923; }
  .sig span:nth-child(1){height:28%}.sig span:nth-child(2){height:50%}.sig span:nth-child(3){height:73%}.sig span:nth-child(4){height:100%}
  .bt { display:flex; align-items:center; gap:1px; }
  .bt-b { width:22px;height:11px; border-radius:2.5px; border:1.5px solid rgba(15,25,35,0.5); position:relative; overflow:hidden; }
  .bt-f { position:absolute; inset:1.5px; right:25%; border-radius:1px; background:#2E7D32; }
  .bt-t { width:2px;height:5px; background:rgba(15,25,35,0.45); border-radius:0 1px 1px 0; }

  /* Iframe area */
  .iw {
    position:absolute; top:8%; left:0; right:0; bottom:0;
    overflow:hidden;
    border-radius:0 0 46px 46px;
  }
  .iw iframe {
    border:none; transform-origin:top left;
    position:absolute; top:0; left:0;
  }

  /* Home bar */
  .hb {
    position:absolute; bottom:1%; left:50%; transform:translateX(-50%);
    width:30%; height:5px;
    background:rgba(15,25,35,0.2); border-radius:3px; z-index:25;
  }

  /* Sheen */
  .sheen {
    position:absolute; inset:0;
    background:linear-gradient(155deg,rgba(255,255,255,0.065) 0%,rgba(255,255,255,0.02) 28%,transparent 52%);
    border-radius:46px; pointer-events:none; z-index:35;
  }

  .fshadow { display:none; }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="phone-outer" id="po">
  <div class="phone-body">
    <div class="phone-screen">
      <div class="phone-display">

        <div class="sb">
          <div class="sb-t" id="clock">09:41</div>
          <div class="sb-i">
            <div class="sig"><span></span><span></span><span></span><span></span></div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path d="M1 5 Q8 -1 15 5" stroke="#0F1923" stroke-width="1.6" stroke-linecap="round" fill="none"/>
              <path d="M3.5 7.5 Q8 3.5 12.5 7.5" stroke="#0F1923" stroke-width="1.6" stroke-linecap="round" fill="none"/>
              <circle cx="8" cy="10.5" r="1.2" fill="#0F1923"/>
            </svg>
            <div class="bt"><div class="bt-b"><div class="bt-f"></div></div><div class="bt-t"></div></div>
          </div>
        </div>

        <div class="di"><div class="di-spk"></div><div class="di-cam"></div></div>

        <div class="iw" id="iw">
          <iframe id="fr" srcdoc="<!DOCTYPE html>
<html lang=&quot;id&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=390, initial-scale=1.0&quot;>
<title>HPMS — Hospital Parking Management System</title>
<link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;>
<link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin>
<link href=&quot;https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap&quot; rel=&quot;stylesheet&quot;>
<link rel=&quot;stylesheet&quot; href=&quot;https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css&quot;>
<style>
:root {
  --blue:#1A6FCC; --blue-dk:#0D4E99; --blue-lt:#E8F2FD; --blue-md:#B8D5F8;
  --green:#2E7D32; --green-lt:#E8F5E9;
  --amber:#8B5000; --amber-lt:#FFF3E0;
  --red:#C62828; --red-lt:#FFEBEE;
  --teal:#00695C; --teal-lt:#E0F2F1;
  --text:#0F1923; --text-2:#5C6E7F; --text-3:#94A3B3;
  --bg:#F2F5F9; --bg-card:#FFFFFF;
  --border:#DDE4EE; --border-lt:#EEF2F7;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --radius:10px; --radius-sm:6px;
  font-family:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ───── SCREEN SWITCHER ───── */
.screen{display:none}
.screen.active{display:flex;height:100vh}

/* ───── LOGIN ───── */
#screen-login{
  background:linear-gradient(135deg,#0D4E99 0%,#1A6FCC 50%,#0891b2 100%);
  align-items:center;justify-content:center;flex-direction:column;gap:0;
}
.login-card{
  background:#fff;border-radius:16px;padding:40px 44px;
  width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.login-logo-icon{
  width:44px;height:44px;background:var(--blue);border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;
}
.login-logo-text .brand{font-size:18px;font-weight:600;letter-spacing:-.3px}
.login-logo-text .sub{font-size:11px;color:var(--text-3)}
.login-title{font-size:20px;font-weight:600;margin-bottom:4px;letter-spacing:-.3px}
.login-sub{font-size:13px;color:var(--text-2);margin-bottom:24px}
.login-form-group{margin-bottom:16px}
.login-label{font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:5px;display:block}
.login-input{
  width:100%;border:1.5px solid var(--border);border-radius:8px;
  padding:10px 14px;font-size:13.5px;background:#fff;color:var(--text);
  outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s;
}
.login-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,111,204,.1)}
.login-role-select{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;
}
.role-option{
  border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;
  cursor:pointer;transition:all .15s;text-align:center;
  background:#fff;
}
.role-option:hover{border-color:var(--blue-md);background:var(--blue-lt)}
.role-option.selected{border-color:var(--blue);background:var(--blue-lt)}
.role-option i{font-size:20px;display:block;margin-bottom:4px;color:var(--text-2)}
.role-option.selected i{color:var(--blue)}
.role-option .rlabel{font-size:12.5px;font-weight:500;color:var(--text-2)}
.role-option.selected .rlabel{color:var(--blue)}
.login-btn{
  width:100%;padding:11px;background:var(--blue);color:#fff;border:none;
  border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;
  transition:background .15s,transform .1s;
}
.login-btn:hover{background:var(--blue-dk)}
.login-btn:active{transform:scale(.98)}
.login-hint{margin-top:14px;font-size:11.5px;color:var(--text-3);text-align:center;line-height:1.6}
.login-hint b{color:var(--text-2)}

/* ───── SHARED APP LAYOUT ───── */
.app{display:flex;width:100%;height:100vh;min-height:600px}
.sidebar{width:220px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border-lt)}
.logo-mark{display:flex;align-items:center;gap:9px}
.logo-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex-shrink:0}
.logo-icon.admin-icon{background:var(--blue)}
.logo-icon.operator-icon{background:var(--teal)}
.logo-text .brand{font-size:15px;font-weight:600;letter-spacing:-.3px}
.logo-text .sub{font-size:10.5px;color:var(--text-3);margin-top:1px}
.nav-section{padding:14px 18px 5px;font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 18px;margin:1px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text-2);transition:background .12s,color .12s;user-select:none}
.nav-item i{font-size:16px;flex-shrink:0}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{font-weight:500}
/* admin nav active = blue */
#screen-admin .nav-item.active{background:var(--blue-lt);color:var(--blue)}
/* operator nav active = teal */
#screen-operator .nav-item.active{background:var(--teal-lt);color:var(--teal)}

.sidebar-user{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border-lt);display:flex;align-items:center;gap:9px}
.sidebar-role-badge{
  font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;
  text-transform:uppercase;letter-spacing:.05em;margin-left:auto;
}
.badge-admin{background:var(--blue-lt);color:var(--blue)}
.badge-operator{background:var(--teal-lt);color:var(--teal)}

.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.av-blue{background:var(--blue-lt);color:var(--blue)}
.av-green{background:var(--green-lt);color:var(--green)}
.av-amber{background:var(--amber-lt);color:var(--amber)}
.av-red{background:var(--red-lt);color:var(--red)}
.av-teal{background:var(--teal-lt);color:var(--teal)}
.user-info .name{font-size:12.5px;font-weight:500}
.user-info .role{font-size:11px;color:var(--text-3)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;flex:1;letter-spacing:-.2px}
.badge-online{display:flex;align-items:center;gap:5px;background:var(--green-lt);color:var(--green);font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:20px}
.badge-online .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse-green 2s infinite}
@keyframes pulse-green{0%,100%{opacity:1}50%{opacity:.4}}
.notif-wrap{position:relative}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--bg-card);position:absolute;top:2px;right:2px;pointer-events:none}
.content{flex:1;overflow-y:auto;padding:22px 24px}

.page{display:none;animation:fadeIn .18s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ───── CARD ───── */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card-title{font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:16px;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.05em}
.card-title i{font-size:15px}

/* ───── STAT CARDS ───── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.s-blue::before{background:var(--blue)}
.stat-card.s-green::before{background:var(--green)}
.stat-card.s-amber::before{background:#E09000}
.stat-card.s-red::before{background:var(--red)}
.stat-card.s-teal::before{background:var(--teal)}
.stat-label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.stat-value{font-size:28px;font-weight:600;letter-spacing:-1px;line-height:1}
.stat-sub{font-size:11px;color:var(--text-3);margin-top:5px}
.c-blue{color:var(--blue)}.c-green{color:var(--green)}.c-amber{color:#B87000}.c-red{color:var(--red)}.c-teal{color:var(--teal)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.span2{grid-column:span 2}

/* ───── TABLE ───── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:10.5px;font-weight:600;color:var(--text-3);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.06em;background:var(--bg)}
td{padding:10px 12px;border-bottom:1px solid var(--border-lt);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFCFF}
.mono{font-family:'DM Mono',monospace;font-size:12px}

/* ───── BADGES ───── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge-active{background:var(--blue-lt);color:var(--blue)}
.badge-done{background:var(--green-lt);color:var(--green)}
.badge-cancel{background:var(--red-lt);color:var(--red)}
.badge-warn{background:var(--amber-lt);color:var(--amber)}
.badge-teal{background:var(--teal-lt);color:var(--teal)}

/* ───── BUTTONS ───── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:13px;color:var(--text);font-family:inherit;font-weight:500;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--bg);border-color:#C8D4E0}
.btn:active{transform:scale(.98)}
.btn i{font-size:15px}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-dk);border-color:var(--blue-dk)}
.btn-teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-teal:hover{background:#004D40}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-success:hover{background:#1B5E20}
.btn-danger{background:var(--red-lt);color:var(--red);border-color:#F2AAAA}
.btn-danger:hover{background:#FFCDD2}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-sm i{font-size:13px}
.btn-icon{padding:7px}
.btn-icon i{font-size:16px}

/* ───── FORMS ───── */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;flex:1;min-width:180px;transition:border-color .12s}
.search-box:focus-within{border-color:var(--blue)}
.search-box i{color:var(--text-3);font-size:15px}
.search-box input{border:none;background:transparent;outline:none;color:var(--text);font-size:13px;width:100%;font-family:inherit}
select,.form-select{border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;background:var(--bg-card);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;outline:none;transition:border-color .12s}
select:focus{border-color:var(--blue)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:5px;display:block}
.form-input{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;background:var(--bg-card);color:var(--text);outline:none;font-family:inherit;transition:border-color .12s}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,111,204,.08)}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.section-title{font-size:16px;font-weight:600;letter-spacing:-.3px}

/* ───── CHART ───── */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:5px;height:100px;padding:0 2px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;background:var(--blue-md);border-radius:3px 3px 0 0;transition:background .12s;cursor:pointer}
.bar:hover{background:var(--blue)}
.bar-lbl{font-size:9.5px;color:var(--text-3)}

/* ───── PETUGAS LIST ───── */
.petugas-list{display:flex;flex-direction:column;gap:8px}
.petugas-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border-lt)}
.petugas-name{font-size:13px;font-weight:500}
.petugas-pos{font-size:11px;color:var(--text-3)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-online{background:#4CAF50}.dot-busy{background:#FF9800}.dot-offline{background:var(--text-3)}

/* ───── SCANNER ───── */
.scanner-area{display:flex;flex-direction:column;align-items:center;gap:20px;padding:16px}
.qr-frame{width:220px;height:220px;border:2px solid var(--blue);border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
.qr-corner{position:absolute;width:22px;height:22px;border-color:var(--blue);border-style:solid}
.qr-corner.tl{top:-1px;left:-1px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.qr-corner.tr{top:-1px;right:-1px;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.qr-corner.bl{bottom:-1px;left:-1px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.qr-corner.br{bottom:-1px;right:-1px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scan-line{position:absolute;width:88%;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{top:14%}50%{top:80%}}
.scan-result{width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:none;box-shadow:var(--shadow-md);animation:fadeIn .18s ease}
.scan-result.show{display:block}
.result-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border-lt)}
.result-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.result-valid{background:var(--green-lt);color:var(--green)}
.result-invalid{background:var(--red-lt);color:var(--red)}
.info-row{display:flex;justify-content:space-between;margin-bottom:9px;font-size:13px;align-items:center}
.info-label{color:var(--text-2)}.info-val{font-weight:500}
.tarif-row{display:flex;justify-content:space-between;align-items:center;background:var(--blue-lt);border-radius:var(--radius-sm);padding:11px 14px;margin:14px 0}

/* ───── LAPORAN TABS ───── */
.laporan-tabs{display:flex;gap:3px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;margin-bottom:18px;width:fit-content}
.tab-btn{padding:6px 18px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--text-2);border:none;background:none;font-family:inherit;font-weight:500;transition:all .12s}
.tab-btn.active{background:var(--bg-card);color:var(--text);box-shadow:var(--shadow);border:1px solid var(--border)}

/* ───── SETTINGS ───── */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.progress-wrap{background:var(--bg);border-radius:4px;height:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease}
.divider{height:1px;background:var(--border-lt);margin:14px 0}

/* ───── OPERATOR SPECIFIC ───── */
.op-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.op-action-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 18px;cursor:pointer;transition:all .18s;text-align:center;
  box-shadow:var(--shadow);
}
.op-action-card:hover{border-color:var(--teal);box-shadow:0 4px 16px rgba(0,105,92,.12);transform:translateY(-2px)}
.op-action-card.primary-action{background:var(--teal);border-color:var(--teal);color:#fff}
.op-action-card.primary-action:hover{background:#004D40}
.op-action-icon{font-size:32px;margin-bottom:10px;display:block}
.op-action-label{font-size:14px;font-weight:600;letter-spacing:-.2px}
.op-action-sub{font-size:11.5px;margin-top:3px;opacity:.7}

.op-status-bar{
  background:var(--teal);color:#fff;
  border-radius:var(--radius);padding:14px 18px;
  display:flex;align-items:center;gap:16px;margin-bottom:18px;
}
.op-status-bar i{font-size:22px;opacity:.85}
.op-status-label{font-size:13px;opacity:.85}
.op-status-value{font-size:22px;font-weight:700;letter-spacing:-1px}

.op-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.op-stat{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;text-align:center;box-shadow:var(--shadow)}
.op-stat-val{font-size:26px;font-weight:600;letter-spacing:-1px}
.op-stat-lbl{font-size:11px;color:var(--text-3);text-transform:uppercase;font-weight:600;letter-spacing:.05em;margin-top:3px}

.op-shift-card{
  background:linear-gradient(135deg,var(--teal) 0%,#00897B 100%);
  color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:18px;
}
.op-shift-title{font-size:12px;font-weight:600;opacity:.75;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.op-shift-name{font-size:18px;font-weight:600;margin-bottom:10px}
.op-shift-row{display:flex;gap:20px;flex-wrap:wrap}
.op-shift-item{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px}

/* ───── MODAL ───── */
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(15,25,35,.45);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
.modal-overlay.hidden{display:none}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);width:100%;max-width:480px;animation:slideUp .18s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-lt)}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text-3);font-size:18px;padding:2px;display:flex;align-items:center}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border-lt)}

/* ───── NOTIF DROPDOWN ───── */
.notif-dropdown{position:fixed;top:56px;right:22px;width:300px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);z-index:200;animation:fadeIn .15s ease}
.notif-dropdown.hidden{display:none}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border-lt);font-size:13px;font-weight:600}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border-lt);font-size:12.5px}
.notif-item:last-child{border-bottom:none}
.notif-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.notif-text{color:var(--text-2);line-height:1.5}
.notif-time{font-size:11px;color:var(--text-3);margin-top:2px}

/* ───── TOAST ───── */
.toast-container{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:var(--text);color:#fff;padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:var(--shadow-md);animation:toastIn .2s ease;pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:320px}
.toast.toast-success{background:var(--green)}
.toast.toast-error{background:var(--red)}
.toast.toast-warn{background:#B87000}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C8D4E0;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#9AAAB8}
</style>

function selectRole(r) {
  currentRole = r;
  document.getElementById('role-admin').classList.toggle('selected', r==='admin');
  document.getElementById('role-operator').classList.toggle('selected', r==='operator');
  document.getElementById('login-user').value = r==='admin' ? 'admin' : 'budi';
  document.getElementById('login-pass').value = '';
}

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const expected = users[currentRole];
  if (u !== expected.user || (p !== expected.pass &amp;&amp; p !== '••••••••')) {
    showToast('Username atau password salah', 'error'); return;
  }
  document.getElementById('screen-login').classList.remove('active');
  if (currentRole === 'admin') {
    document.getElementById('screen-admin').classList.add('active');
    initAdmin();
  } else {
    document.getElementById('screen-operator').classList.add('active');
    initOperator(expected);
  }
}

function doLogout() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
  showToast('Berhasil logout dari sistem', '');
}

// ══ TOAST ══
function showToast(msg, type='') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' toast-'+type : '');
  const icon = type==='success'?'ti-circle-check':type==='error'?'ti-circle-x':type==='warn'?'ti-alert-triangle':'ti-info-circle';
  t.innerHTML = `<i class=&quot;ti ${icon}&quot; style=&quot;font-size:16px;flex-shrink:0;&quot;></i> ${msg}`;
  c.appendChild(t);
  setTimeout(()=>{ t.style.animation='toastOut .2s ease forwards'; setTimeout(()=>t.remove(),200); },3000);
}

function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.body.style.overflow='hidden'; }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.body.style.overflow=''; }

function badgeClass(s) { return s==='AKTIF'?'badge-active':s==='SELESAI'?'badge-done':'badge-cancel'; }
function fmtRp(n) { return 'Rp '+Number(n).toLocaleString('id-ID'); }

// ══════════════════════ ADMIN ══════════════════════
function initAdmin() {
  updateStats(); renderRecentTable(); renderPetugasAktif();
  renderHourlyChart('hourly-chart'); renderHourlyChart('laporan-hour-chart');
  renderTiketTable(); renderPetugasTable(); renderTarifTable(); renderLaporanChart();
}

function adminPage(id, el) {
  document.querySelectorAll('#screen-admin .page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('#screen-admin .nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('admin-page-'+id).classList.add('active');
  el.classList.add('active');
  const titles={dashboard:'Dashboard',tiket:'Tiket Parkir',laporan:'Laporan',petugas:'Manajemen Petugas',tarif:'Konfigurasi Tarif',pengaturan:'Pengaturan Sistem'};
  document.getElementById('admin-page-title').textContent = titles[id]||id;
}

function updateStats() {
  const dalam=tickets.filter(t=>t.status==='AKTIF').length;
  const masuk=tickets.filter(t=>t.status!=='BATAL').length;
  const keluar=tickets.filter(t=>t.status==='SELESAI').length;
  const sisa=120-dalam;
  ['stat-dalam','stat-masuk','stat-keluar'].forEach((id,i)=>{ const el=document.getElementById(id); if(el) el.textContent=[dalam,masuk,keluar][i]; });
  const pctEl=document.getElementById('kapasitas-pct'); if(pctEl) pctEl.textContent=Math.round(sisa/120*100)+'% tersedia';
}

function renderRecentTable() {
  const el=document.getElementById('recent-table'); if(!el) return;
  el.innerHTML=tickets.slice(0,6).map(t=>`<tr><td class=&quot;mono&quot;>${t.no}</td><td>${t.jenis}</td><td>${t.masuk}</td><td><span class=&quot;badge ${badgeClass(t.status)}&quot;>${t.status}</span></td></tr>`).join('');
}

function renderPetugasAktif() {
  const el=document.getElementById('petugas-aktif'); if(!el) return;
  const colors=['av-blue','av-green','av-amber'];
  el.innerHTML=petugas.filter(p=>p.aktif).map((p,i)=>`<div class=&quot;petugas-row&quot;><div class=&quot;avatar ${colors[i%colors.length]}&quot;>${p.inisial}</div><div style=&quot;flex:1;&quot;><div class=&quot;petugas-name&quot;>${p.nama}</div><div class=&quot;petugas-pos&quot;>${p.pos}</div></div><div class=&quot;status-dot dot-online&quot;></div></div>`).join('');
}

function renderHourlyChart(id) {
  const w=document.getElementById(id); if(!w) return;
  const max=Math.max(...hourlyData);
  const isShort=id==='hourly-chart';
  const show=isShort?hourlyData.slice(5,17):hourlyData;
  const labels=isShort?Array.from({length:12},(_,i)=>(i+5)+'h'):Array.from({length:24},(_,i)=>i%6===0?i+'h':'');
  w.innerHTML=show.map((v,i)=>`<div class=&quot;bar-col&quot;><div class=&quot;bar&quot; style=&quot;height:${Math.round(v/max*88)+5}px;&quot; title=&quot;${v} kendaraan&quot;></div><div class=&quot;bar-lbl&quot;>${labels[i]}</div></div>`).join('');
}

let filterText='',filterStatusVal='',filterJenisVal='';

<script>
function mobileNavActive(navId, el) {

// Patch screen switching to show mobile nav
function showMobileNav(role) {
  document.getElementById('mobile-nav-admin').style.display = role==='admin' ? 'flex' : 'none';
  document.getElementById('mobile-nav-operator').style.display = role==='operator' ? 'flex' : 'none';
}

// Intercept screen switches
document.getElementById('screen-admin').addEventListener('transitionend', function(){});

// Watch for screen changes
const observer = new MutationObserver(function() {
  const adminActive = document.getElementById('screen-admin').classList.contains('active');
  const opActive = document.getElementById('screen-operator').classList.contains('active');
  if(adminActive) showMobileNav('admin');
  else if(opActive) showMobileNav('operator');
  else { 
    document.getElementById('mobile-nav-admin').style.display='none';
    document.getElementById('mobile-nav-operator').style.display='none';
  }
});

['screen-admin','screen-operator','screen-login'].forEach(id => {
  observer.observe(document.getElementById(id), {attributes:true, attributeFilter:['class']});
});

// Put mobile navs inside their screen apps
document.addEventListener('DOMContentLoaded', function() {});
// Append navs to app containers now
document.getElementById('screen-admin').querySelector('.app').appendChild(document.getElementById('mobile-nav-admin'));
document.getElementById('screen-operator').querySelector('.app').appendChild(document.getElementById('mobile-nav-operator'));
</script>

<script>
  function tick(){const n=new Date();document.getElementById('clock').textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');}
  tick(); setInterval(tick,1000);

  function layout(){
    const vw=window.innerWidth, vh=window.innerHeight;
    // Make phone fill height, maintain 9:19.5 ratio
    let pH = vh * 0.96;
    let pW = pH * (390/844); // iPhone 14 ratio
    if(pW > vw * 0.96){ pW = vw*0.96; pH = pW*(844/390); }

    const po = document.getElementById('po');
    po.style.width = pW+'px';
    po.style.height = pH+'px';

    // Scale iframe: app is 390px wide, scale to actual phone screen width
    const iw = document.getElementById('iw');
    const fr = document.getElementById('fr');
    // Screen area is ~97% of phone width
    const screenW = pW * 0.972;
    const screenH = pH * 0.972;
    // iframe area is screen minus status bar (8%)
    const iwW = screenW;
    const iwH = screenH * 0.92;
    const scale = iwW / 390;
    const appH = iwH / scale;

    fr.style.width = '390px';
    fr.style.height = appH + 'px';
    fr.style.transform = 'scale('+scale+')';
  }

  window.addEventListener('resize', layout);
  document.getElementById('fr').addEventListener('load', layout);
  layout();
</script>
